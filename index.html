<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
/* ---------------------------------------------------------------------------
   Tokens. El azul de marca (#1668ff) es SOLO cromo: botones, foco, el aro del
   logo. Los datos usan los pasos validados para superficie oscura -- si se
   pintan las barras con el azul de marca, deja de estar validado el contraste.
   --------------------------------------------------------------------------- */
:root {
  --bg:            #0a0a0b;
  --surface-1:     #16161a;
  --surface-2:     #1e1e23;
  --border:        #2a2a31;
  --text-primary:  #ffffff;
  --text-secondary:#a1a1ad;
  --text-muted:    #6e6e7a;

  --brand:         #1668ff;

  --series-1:      #3987e5;   /* telegram  */
  --series-2:      #d95926;   /* whatsapp  */
  --series-3:      #199e70;   /* instagram */

  --good:          #0ca30c;
  --warning:       #fab219;
  --wa:            #25D366;   /* verde real de WhatsApp, solo para el boton de contactar */
  --ig:            #C13584;   /* magenta de Instagram, mismo uso: solo el boton */

  --r: 10px;

  /* Las barras de desplazamiento las dibuja el navegador, no el CSS del
     tablero: sin esta linea las pinta en claro y cortan el panel oscuro por
     la mitad. `color-scheme` es lo unico que se lo avisa, y de paso arregla
     los controles nativos (el caret y el autocompletado del campo de clave).
     Lo de abajo, en .hilo/.lista, solo afina el grosor y el color. */
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
/* El atributo hidden vale display:none, pero cualquier display explicito se lo
   come. #login es un grid, asi que sin esto la pantalla de ingreso sigue
   ocupando lugar arriba del panel. */
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }

/* ---------- logo ---------- */
.marca { display: flex; align-items: center; gap: 12px; }
.aro {
  width: 38px; height: 38px; border-radius: 50%;
  border: 2.5px solid var(--brand); background: #000;
  display: flex; align-items: flex-end; justify-content: center;
  gap: 2px; padding-bottom: 13px; flex: none;
}
.aro i { display: block; width: 3px; background: #fff; border-radius: 1px; }
.aro i:nth-child(1) { height: 7px; }
.aro i:nth-child(2) { height: 11px; }
.aro i:nth-child(3) { height: 5px; }
.marca .txt strong {
  display: block; font-size: 15px; font-weight: 750;
  letter-spacing: 0.14em; line-height: 1.1;
}
.marca .txt span {
  display: block; font-size: 9.5px; letter-spacing: 0.16em;
  color: var(--text-muted); text-transform: uppercase;
}

/* ---------- ingreso ---------- */
#login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.card-login {
  width: 100%; max-width: 380px; background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 14px; padding: 32px 28px;
}
.card-login h1 { font-size: 19px; margin: 26px 0 6px; }
.card-login p { color: var(--text-secondary); font-size: 13.5px; margin: 0 0 22px; }
label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 7px; }
input[type=password], input[type=search] {
  width: 100%; padding: 11px 13px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text-primary); font-size: 15px; font-family: inherit;
}
input:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: transparent; }
button {
  font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  border-radius: 9px; border: 1px solid transparent; padding: 11px 16px;
  background: var(--brand); color: #fff;
}
button:hover { filter: brightness(1.12); }
button:disabled { opacity: .55; cursor: default; filter: none; }
button.ghost {
  background: transparent; border-color: var(--border);
  color: var(--text-secondary); padding: 8px 13px; font-size: 13px;
}
button.ghost:hover { color: var(--text-primary); border-color: var(--text-muted); filter: none; }
.error { color: #ff8f8f; font-size: 13px; margin-top: 13px; min-height: 18px; }
.recordar {
  display: flex; align-items: center; gap: 9px;
  margin: 14px 0 0; cursor: pointer; user-select: none;
}
.recordar input {
  width: 15px; height: 15px; margin: 0; cursor: pointer; accent-color: var(--brand);
}

/* ---------- estructura ---------- */
#app { max-width: 1180px; margin: 0 auto; padding: 22px 20px 64px; }
header.top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; padding-bottom: 18px;
  border-bottom: 1px solid var(--border); margin-bottom: 24px;
}
.top .acciones { display: flex; align-items: center; gap: 10px; }
.sello { font-size: 12px; color: var(--text-muted); }
/* El catalogo desactualizado no puede leerse igual que el resto del sello:
   es la unica pista de que los numeros de arriba envejecieron. */
.sello-viejo { color: var(--warning); font-weight: 600; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--border); margin: 0 0 26px; }
.tab {
  font-family: inherit; padding: 13px 2px; margin-bottom: -1px;
  font-size: 13.5px; font-weight: 600; color: var(--text-secondary);
  background: transparent; border: 0; border-bottom: 2px solid transparent; cursor: pointer;
}
.tab:hover { color: var(--text-primary); }
.tab.activo { color: var(--text-primary); border-bottom-color: var(--brand); }

section { margin-bottom: 26px; }
.titulo { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--text-muted); margin-bottom: 12px; font-weight: 600; }

.panel {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--r); padding: 18px 20px;
}
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 860px) { .dos { grid-template-columns: 1fr; } }

/* ---------- stat tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
@media (max-width: 1000px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 620px)  { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--r); padding: 15px 16px;
}
.tile .n {
  font-size: 30px; font-weight: 680; letter-spacing: -0.025em;
  line-height: 1.05; font-variant-numeric: tabular-nums;
}
.tile .n small { font-size: 15px; font-weight: 600; color: var(--text-secondary); margin-left: 1px; }
.tile .k { font-size: 12px; color: var(--text-secondary); margin-top: 5px; }
.tile .sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
.tile.destaca { border-color: rgba(22,104,255,.45); }

/* ---------- barras ---------- */
.barras { display: flex; flex-direction: column; gap: 2px; }
/* Con muchas filas la lista empuja todo lo de abajo fuera de la pantalla. El
   alto lo pone barras() midiendo las filas ya pintadas, no en px fijos: asi no
   se corta una fila por la mitad si cambia la tipografia. */
/* overflow-x: hidden es obligatorio, no cosmetico: con overflow-y en auto el
   navegador computa overflow-x en auto tambien, y basta un subpixel de ancho
   sobrante para que aparezca una barra horizontal que se come 11px de alto y
   parte al medio la fila numero 10. */
.barras.scrollea { overflow-y: auto; overflow-x: hidden; padding-right: 8px; }
.fila { padding: 5px 0; }
.fila .cab {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 10px; margin-bottom: 5px; font-size: 13px;
}
.fila .cab b { font-weight: 600; }
.fila .cab em {
  font-style: normal; color: var(--text-secondary);
  font-variant-numeric: tabular-nums; font-size: 12.5px;
}
.pista { height: 9px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.marca-barra {
  height: 100%; border-radius: 0 4px 4px 0; min-width: 3px;
  transition: width .35s ease;
}
.punto { width: 9px; height: 9px; border-radius: 3px; display: inline-block;
  vertical-align: -1px; margin-right: 7px; flex: none; }

/* ---------- heatmap ---------- */
.heat-wrap { overflow-x: auto; padding-bottom: 4px; }
.heat { display: grid; grid-template-columns: 34px repeat(24, minmax(21px, 1fr)); gap: 2px; min-width: 620px; }
.heat .hh { font-size: 9.5px; color: var(--text-muted); text-align: center; padding-bottom: 3px; }
.heat .dd { font-size: 10.5px; color: var(--text-secondary); display: flex; align-items: center; }
.celda {
  aspect-ratio: 1 / 1; border-radius: 3px; background: var(--surface-2);
  border: 1px solid transparent;
}
.celda.v { border-color: rgba(255,255,255,.06); cursor: pointer; }
.celda.v:hover { border-color: rgba(255,255,255,.45); }
.celda:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
/* Con una celda elegida, el resto se apaga: la seleccion tiene que leerse de
   un vistazo sobre una rampa que ya es toda del mismo tono. */
.heat.filtrando .celda { opacity: .3; }
.heat.filtrando .celda.sel {
  opacity: 1; outline: 2px solid var(--text-primary); outline-offset: 1px;
}
.escala { display: flex; align-items: center; gap: 7px; margin-top: 12px; font-size: 11px; color: var(--text-muted); }
.escala .paso { width: 17px; height: 9px; border-radius: 2px; }

/* ---------- conversaciones ---------- */
.charla { display: grid; grid-template-columns: 320px 1fr; gap: 16px; }
@media (max-width: 860px) { .charla { grid-template-columns: 1fr; } }
.lista { max-height: 520px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.item {
  text-align: left; width: 100%; background: transparent; border: 1px solid transparent;
  border-radius: 9px; padding: 11px 12px; cursor: pointer; color: inherit;
  font-size: 13px; font-weight: 400; display: block;
}
.item:hover { background: var(--surface-2); filter: none; }
.item[aria-current="true"] { background: var(--surface-2); border-color: rgba(22,104,255,.5); }
.item .nom { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; }
.item .meta { color: var(--text-muted); font-size: 11.5px; margin-top: 3px; }
.item .prev {
  color: var(--text-secondary); font-size: 12px; margin-top: 4px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hilo { max-height: 520px; overflow-y: auto; padding-right: 4px; }

/* Encabezado del hilo: con quien estas hablando y como contactarlo sin salir
   de aca. Va FUERA de .hilo a proposito, para que no se vaya con el scroll. */
.hilo-cab {
  display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
  padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 10px;
}
.hilo-cab .quien { min-width: 0; flex: 1; }
.hilo-cab .nom { font-size: 13.5px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hilo-cab .tel {
  display: flex; align-items: center; gap: 5px; margin-top: 2px;
  font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums;
}
.hilo-cab .btn-wa { height: 34px; font-size: 11.5px; }

/* Cartel del filtro por horario. Sin esto la lista queda recortada y no hay
   forma de saber por que. */
.filtro-celda {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  padding: 7px 10px; font-size: 12px; color: var(--text-secondary);
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
}
.filtro-celda[hidden] { display: none; }
.filtro-celda .etq { font-weight: 600; color: var(--text-primary); }
.filtro-celda .cant { color: var(--text-muted); }
.filtro-celda .quitar {
  margin-left: auto; background: transparent; border: 0; color: var(--text-muted);
  cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 5px; border-radius: 5px;
}
.filtro-celda .quitar:hover { background: var(--border); color: var(--text-primary); }

/* ---------- chips de operacion y origen ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; align-items: center; }
.chips .grupo { font-size: 11px; color: var(--text-muted); margin-right: 2px; }
.chip {
  font: inherit; font-size: 11.5px; line-height: 1; cursor: pointer;
  padding: 6px 10px; border-radius: 999px;
  background: transparent; color: var(--text-secondary);
  border: 1px solid var(--border);
}
.chip:hover { color: var(--text-primary); border-color: rgba(255,255,255,.28); }
.chip.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
.chip:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
/* El contador va en el chip: sin el, elegir un filtro que deja cero resultados
   parece que rompio el panel en vez de informar que no hay nada. */
.chip .n { opacity: .65; margin-left: 5px; }
.chip.on .n { opacity: .85; }

/* Etiquetas dentro de cada conversacion de la lista. */
.tags { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
.tag {
  font-size: 10px; line-height: 1; padding: 3px 6px; border-radius: 4px;
  border: 1px solid var(--border); color: var(--text-secondary);
}
.tag.pauta { border-color: rgba(217,89,38,.5); color: #e8845c; }

/* Barras clickeables (propiedades). Mismo lenguaje que el heatmap: con una
   elegida, las demas se apagan para que la seleccion se lea de un vistazo. */
.barras.elige .fila { cursor: pointer; border-radius: 6px; }
.barras.elige .fila:hover { background: rgba(255,255,255,.04); }
.barras.elige .fila:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
.barras.filtrando .fila { opacity: .35; }
.barras.filtrando .fila.sel { opacity: 1; }
.barras.filtrando .fila.sel .cab b { color: var(--text-primary); }

/* Barra de desplazamiento discreta en los tres paneles que scrollean.
   La regla estandar (scrollbar-*) la entienden Firefox y Chrome nuevo; la de
   ::-webkit- cubre Safari y los Chrome viejos. Se dejan las dos porque hacen
   lo mismo y ninguna sola alcanza para todos. */
.hilo, .lista, .heat-wrap, .barras.scrollea {
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.hilo::-webkit-scrollbar,
.lista::-webkit-scrollbar,
.heat-wrap::-webkit-scrollbar,
.barras.scrollea::-webkit-scrollbar { width: 8px; height: 8px; }

.hilo::-webkit-scrollbar-track,
.lista::-webkit-scrollbar-track,
.heat-wrap::-webkit-scrollbar-track,
.barras.scrollea::-webkit-scrollbar-track { background: transparent; }

.hilo::-webkit-scrollbar-thumb,
.lista::-webkit-scrollbar-thumb,
.heat-wrap::-webkit-scrollbar-thumb,
.barras.scrollea::-webkit-scrollbar-thumb {
  background: var(--border); border-radius: 4px;
}
.hilo::-webkit-scrollbar-thumb:hover,
.lista::-webkit-scrollbar-thumb:hover,
.heat-wrap::-webkit-scrollbar-thumb:hover,
.barras.scrollea::-webkit-scrollbar-thumb:hover { background: #3d3d47; }
/* width:fit-content para que la burbuja se ajuste al texto. Sin esto el div
   ocupa el 84% completo y un "hola" queda con una barra vacia al lado. */
.msg { margin-bottom: 12px; max-width: 84%; width: fit-content; }
.msg.agente { margin-left: auto; }
.burbuja {
  padding: 9px 13px; border-radius: 13px; font-size: 13.5px; white-space: pre-wrap;
  word-break: break-word; background: var(--surface-2);
}
.msg.agente .burbuja { background: #17325c; border-top-right-radius: 4px; }
.msg.cliente .burbuja { border-top-left-radius: 4px; }
/* overflow-wrap para que una URL larga no ensanche la columna */
.burbuja a { color: #8ab6f5; overflow-wrap: anywhere; }
.burbuja a:hover { color: #b7d3f6; }
.sello-msg { font-size: 10.5px; color: var(--text-muted); margin-top: 4px; }
.msg.agente .sello-msg { text-align: right; }
.fuera {
  display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 4px;
  background: rgba(250,178,25,.15); color: var(--warning); font-size: 10px;
  font-weight: 600; letter-spacing: .02em;
}
.vacio { color: var(--text-muted); font-size: 13px; padding: 26px 4px; text-align: center; }

/* ---------- clientes ---------- */
.filtros { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.buscador { position: relative; flex: 1; min-width: 240px; max-width: 360px; }
.buscador svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
.buscador input { padding-left: 36px; }
.cant-clientes { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

.avatar {
  width: 46px; height: 46px; border-radius: 50%; background: var(--surface-2);
  border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 650; color: var(--text-secondary); flex: none; position: relative;
}
.punto-canal { position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--surface-1); }
.chip-prop {
  display: inline-block; font-size: 11.5px; color: var(--text-secondary);
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px;
  align-self: flex-start; margin-top: 2px;
}
.chip-prop.vacia { color: var(--text-muted); }

.grid-clientes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
@media (max-width: 860px) { .grid-clientes { grid-template-columns: 1fr; } }
.card-cliente {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--r);
  padding: 16px; display: flex; gap: 14px;
}
.card-cliente-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.card-cliente-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.card-cliente-top .nombre { font-weight: 650; font-size: 14.5px; padding-top: 4px; }
.card-cliente-body .contacto { font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.card-cliente-meta { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.canal-label { font-weight: 600; }
.btn-wa {
  display: flex; align-items: center; justify-content: center; gap: 6px; flex: none;
  height: 44px; background: var(--wa); color: #fff; border: 0; border-radius: 9px;
  padding: 0 13px; font-size: 12px; font-weight: 650; cursor: pointer; text-decoration: none;
}
.btn-wa:hover { filter: brightness(1.08); color: #fff; }
/* El mismo boton para Instagram. Cambia el color porque el verde de WhatsApp
   sobre un contacto de Instagram se lee como el canal equivocado. */
.btn-wa.ig { background: var(--ig); }
.sin-contacto { font-size: 11.5px; color: var(--text-muted); flex: none; padding-top: 4px; }

/* ---------- tooltip ---------- */
#tip {
  position: fixed; z-index: 50; pointer-events: none; opacity: 0;
  background: #000; border: 1px solid var(--border); border-radius: 7px;
  padding: 7px 10px; font-size: 12px; line-height: 1.45; white-space: nowrap;
  transition: opacity .12s; box-shadow: 0 6px 22px rgba(0,0,0,.6);
}
#tip b { font-weight: 650; }
#tip span { color: var(--text-secondary); }

footer { color: var(--text-muted); font-size: 11.5px; text-align: center; padding-top: 10px; }
.spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--text-muted);
  border-top-color: transparent; border-radius: 50%; animation: g 0.7s linear infinite;
  vertical-align: -2px; margin-right: 7px; }
@keyframes g { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="login">
  <div class="card-login">
    <div class="marca">
      <div class="aro"><i></i><i></i><i></i></div>
      <div class="txt"><strong>GRUNWALDT</strong><span>Negocios Inmobiliarios</span></div>
    </div>
    <h1>Panel de consultas</h1>
    <p>Lo que respondió el asistente, en tiempo real.</p>
    <label for="clave">Clave de acceso</label>
    <input type="password" id="clave" autocomplete="current-password">
    <label class="recordar" for="recordar">
      <input type="checkbox" id="recordar"> Recordarme en este dispositivo
    </label>
    <div class="error" id="errLogin"></div>
    <button id="btnEntrar" style="width:100%;margin-top:6px">Entrar</button>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="marca">
      <div class="aro"><i></i><i></i><i></i></div>
      <div class="txt"><strong>GRUNWALDT</strong><span>Panel de consultas</span></div>
    </div>
    <div class="acciones">
      <span class="sello" id="sello"></span>
      <button class="ghost" id="btnRefrescar">Actualizar</button>
      <button class="ghost" id="btnSalir">Salir</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab activo" id="tabResumenBtn" type="button">Resumen</button>
    <button class="tab" id="tabClientesBtn" type="button">Clientes</button>
  </div>

  <div id="vistaResumen">
    <section>
      <div class="titulo">Resumen</div>
      <div class="tiles" id="tiles"></div>
    </section>

    <section class="dos">
      <div class="panel">
        <div class="titulo">Consultas por canal</div>
        <div class="barras" id="canales"></div>
      </div>
      <div class="panel">
        <div class="titulo">Propiedades ofrecidas</div>
        <div class="barras" id="propiedades"></div>
      </div>
    </section>

    <section class="panel">
      <div class="titulo">Cuándo escriben</div>
      <div class="heat-wrap"><div class="heat" id="heat"></div></div>

          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><line x1="11" y1="11" x2="14.5" y2="14.5"/></svg>
          <input type="search" id="buscarClientes" placeholder="Buscar por nombre o teléfono…">

<script>
/* ===========================================================================
   Estado
   =========================================================================== */
// Esta pagina NO corre en Apps Script: es HTML estatico servido desde
// appgrun.giwa-ia.com y le pega directo al webhook de n8n. La clave que tipea
// el cliente ES la credencial de la API -la valida n8n en "Armar parametros"-,
// asi que no hay ningun secreto aparte escondido en este archivo.
var API_URL = 'https://giwa-ia.app.n8n.cloud/webhook/grun-dashboard';
var CLAVE = null;
var DATOS = null;
var ACTIVA = null;
// Celda del heatmap elegida, o null. { dia: 0-6, hora: 0-23 }. Filtra la lista
// de conversaciones; se limpia con un clic afuera, con Escape, o volviendo a
// hacer clic en la misma celda.
var CELDA = null;
// Los otros tres filtros de la lista de conversaciones. Los cuatro se combinan
// con Y: elegir una celda del heatmap y despues "Alquiler" deja las de esa hora
// que ademas son de alquiler.
var REF = null;      // REF de propiedad elegida en las barras, o null
var CANAL = null;    // 'whatsapp' | 'instagram' | 'telegram'
var OPER = null;     // 'compra' | 'alquiler' | 'vende' | 'sin_determinar'
var ORIGEN = null;   // 'pauta' | 'espontanea'

// Etiquetas de los dos cortes nuevos. 'vende' no es una operacion que busque la
// persona sino alguien que quiere que le vendan LO SUYO: es un lead de
// captacion, y meterlo en compra o en alquiler seria archivarlo mal.
var OPER_LABEL = { compra: 'Compra', alquiler: 'Alquiler', vende: 'Quiere vender', sin_determinar: 'Sin determinar' };
var ORIGEN_LABEL = { pauta: 'Pauta', espontanea: 'Espontánea' };

var DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
var ORDEN_DIAS = [1,2,3,4,5,6,0];              // se lee de lunes a domingo
var COLOR_CANAL = { telegram: 'var(--series-1)', whatsapp: 'var(--series-2)', instagram: 'var(--series-3)' };
var CANAL_LABEL = { telegram: 'Telegram', whatsapp: 'WhatsApp', instagram: 'Instagram' };

// Icono de telefono para "Contactar". Un solo trazo, para que si se suman mas
// iconos despues tengan con que hacer juego.
var ICONO_TEL = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
var ICONO_IG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.1" fill="currentColor" stroke="none"/></svg>';

// Rampa secuencial azul, de oscuro (casi nada) a claro (mucho). Va en ese
// sentido porque la superficie es oscura: el paso mas bajo tiene que fundirse
// con el fondo, no destacarse.
var RAMPA = ['#184f95','#256abf','#3987e5','#5598e7','#86b6ef','#b7d3f6'];

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function num(n) { return Number(n || 0).toLocaleString('es-AR'); }
function plural(n, sing, plu) { return Number(n) === 1 ? sing : plu; }

function iniciales(nombre) {
  var partes = String(nombre || '').trim().split(/\s+/).filter(Boolean).slice(0, 2);
  return partes.map(function (p) { return p.charAt(0); }).join('').toUpperCase();
}

// canal_id de WhatsApp es el numero crudo, sin "+" (ej "5493794357488"). Solo
// se formatea bonito cuando calza con el patron real de un movil argentino
// -54 9 + area de 4 + local de 6-, que es el 100% de lo que entra hoy. Ante
// cualquier otra forma, mejor mostrar el numero tal cual con un "+" que
// inventarle una separacion que no es.
function formatTelefono(raw) {
  var d = String(raw || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.length === 13 && d.slice(0, 2) === '54') {
    var area = d.slice(3, 7), local = d.slice(7);
    return '+' + d.slice(0, 2) + ' ' + d.slice(2, 3) + ' ' + area + ' ' + local.slice(0, 2) + '-' + local.slice(2);
  }
  return '+' + d;
}

/* En la base se guarda el texto CRUDO del agente, con su markdown. Es lo
   correcto: es lo que el modelo produjo y es lo que vuelve a leer como
   historial. Cada superficie lo renderiza a su manera — Telegram lo pasa a HTML
   en "Sanitizar respuesta", y acá lo hacemos para la pantalla.
   Los links salen primero y vuelven al final: si no, la regla de negrita se
   come los asteriscos que puedan venir dentro de una URL. */
function formatear(s) {
  var t = esc(s);
  var links = [];
  t = t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, function (m, txt, url) {
    var limpio = txt.trim();
    var visible = (limpio === url || limpio === url.replace(/\/+$/, '')) ? url : limpio;
    links.push('<a href="' + url + '" target="_blank" rel="noopener noreferrer">' +
               visible + '</a>');
    return '\u0000L' + (links.length - 1) + '\u0000';
  });
  t = t.replace(/^[ \t]*[*-][ \t]+/gm, '• ');
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  t = t.replace(/\u0000L(\d+)\u0000/g, function (m, i) { return links[+i]; });
  return t;
}

/* ===========================================================================
   Ingreso
   =========================================================================== */
$('btnEntrar').addEventListener('click', entrar);
$('clave').addEventListener('keydown', function (e) { if (e.key === 'Enter') entrar(); });

/* ---------------------------------------------------------------------------
   Donde vive la clave.

   Por defecto en sessionStorage: se borra al cerrar la pestaña. Con
   "Recordarme" pasa a localStorage y sobrevive al cierre del navegador, que es
   la unica forma de que el cliente no la tipee cada vez. Es su propia maquina y
   es la misma decision que toma cualquier gestor de contraseñas; "Salir" borra
   las dos copias.
   --------------------------------------------------------------------------- */
function guardarClave(clave, recordar) {
  try {
    sessionStorage.removeItem('grun_clave');
    localStorage.removeItem('grun_clave');
    (recordar ? localStorage : sessionStorage).setItem('grun_clave', clave);
  } catch (e) {}
}

function claveGuardada() {
  try {
    return localStorage.getItem('grun_clave') || sessionStorage.getItem('grun_clave');
  } catch (e) { return null; }
}

function olvidarClave() {
  try {
    sessionStorage.removeItem('grun_clave');
    localStorage.removeItem('grun_clave');
  } catch (e) {}
}

/**
 * Unica llamada a la API. La clave viaja como parametro y la valida n8n;
 * un 401 es "clave incorrecta". Se pide sin headers propios a proposito:
 * un GET simple no dispara preflight de CORS.
 */
function pedirDatos(clave) {
  return fetch(API_URL + '?k=' + encodeURIComponent(clave), { cache: 'no-store' })
    .then(function (r) {
      if (r.status === 401) {
        var e = new Error('Clave incorrecta.');
        e.noAutorizado = true;
        throw e;
      }
      if (!r.ok) {
        throw new Error('La API respondio ' + r.status +
                        '. Revisa que el workflow este publicado.');
      }
      return r.text().then(function (txt) {
        try { return JSON.parse(txt); }
        catch (e) { throw new Error('La API devolvió algo que no se pudo leer.'); }
      });
    });
}

// Entrar y cargar son la misma llamada: si la clave sirve, ya vienen los datos.
function entrar() {
  var b = $('btnEntrar');
  b.disabled = true; b.textContent = 'Verificando…';
  $('errLogin').textContent = '';
  var clave = $('clave').value;
  pedirDatos(clave)
    .then(function (datos) {
      CLAVE = clave;
      guardarClave(clave, $('recordar').checked);
      $('login').hidden = true;
      $('app').hidden = false;
      DATOS = datos;
      pintar();
    })
    .catch(function (err) {
      $('errLogin').textContent = String((err && err.message) || err);
      b.disabled = false; b.textContent = 'Entrar';
    });
}

(function () {
  var c = claveGuardada();
  if (c) { CLAVE = c; $('login').hidden = true; $('app').hidden = false; cargar(); }
})();

$('btnSalir').addEventListener('click', function () {
  olvidarClave();
  location.reload();
});
$('btnRefrescar').addEventListener('click', cargar);

/* ===========================================================================
   Carga
   =========================================================================== */
function cargar() {
  $('sello').innerHTML = '<span class="spin"></span>Cargando…';
  pedirDatos(CLAVE)
    .then(function (datos) { DATOS = datos; pintar(); })
    .catch(function (err) {
      // Si la clave dejo de servir (se cambio en n8n), volvemos al ingreso.
      if (err && err.noAutorizado) {
        olvidarClave();
        location.reload();
        return;
      }
      $('sello').textContent = String((err && err.message) || err);
    });
}

// El catalogo lo trae un workflow cada 6 horas. Si esa corrida se cae, los
// numeros de abajo pasan a ser de otro dia y el tablero los sigue mostrando
// como si nada. Doce horas son dos corridas perdidas seguidas: ahi ya no es un
// dato, es un aviso.
var HORAS_CATALOGO_VIEJO = 12;

// La fecha viene como "08/08/2026 07:56", en hora de Buenos Aires. Se compara
// contra el reloj del navegador: si alguien abre el tablero desde otro huso, la
// cuenta se corre por la diferencia. Para un umbral de doce horas no cambia
// nada, y el equipo mira esto desde Corrientes.
function horasDesde(txt) {
  var m = /^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})$/.exec(String(txt || ''));
  if (!m) return null;
  var t = new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5]).getTime();
  return isFinite(t) ? (Date.now() - t) / 36e5 : null;
}

function pintar() {
  // Datos nuevos, filtro viejo no: la celda elegida se refiere a una foto que
  // ya no es la que esta en pantalla. Vale igual para los otros tres.
  CELDA = null; REF = null; CANAL = null; OPER = null; ORIGEN = null;
  // Ademas de cuando se genero el tablero, cuando se sincronizo el catalogo
  // contra el CRM. Son cosas distintas: el tablero se arma en el momento, el
  // catalogo lo trae el workflow "API xintel".
  var sinc = (DATOS.inventario || {}).ultima_sync;
  var sello = $('sello');
  sello.textContent = 'Actualizado ' + DATOS.generado;
  if (sinc) {
    var horas = horasDesde(sinc);
    var viejo = horas !== null && horas > HORAS_CATALOGO_VIEJO;
    var marca = document.createElement('span');
    marca.textContent = ' · catálogo al ' + sinc + (viejo ? ' — sin actualizar' : '');
    if (viejo) {
      marca.className = 'sello-viejo';
      marca.title = 'Hace ' + Math.floor(horas) + ' horas que no se sincroniza con el CRM.';
    }
    sello.appendChild(marca);
  }
  tiles();
  canales();
  propiedades();
  heat();
  chips();
  lista();
  clientes();
}

/* ===========================================================================
   Stat tiles — numeros sueltos, sin grafico: es lo que corresponde cuando el
   dato es una magnitud unica y no una comparacion.
   =========================================================================== */
function tiles() {
  var r = DATOS.resumen || {};
  var v = DATOS.visitas || {};
  var inv = DATOS.inventario || {};
  var seg = r.respuesta_mediana_seg;
  var tiempo = seg == null ? '—'
    : (seg < 60 ? [Math.round(seg), '<small>s</small>'].join('')
                : [Math.round(seg / 60), '<small>min</small>'].join(''));

  // La conversion es el numero que justifica el asistente: de cada persona que
  // escribio, cuantas terminaron con una visita en el calendario.
  //
  // Se divide por PERSONAS que agendaron, no por visitas: una misma persona
  // puede pedir dos y el subtitulo decia "200% de quienes consultaron", que
  // aunque la cuenta cerrara se leia como un error. El tope al 100% es por si
  // aparece una visita cuyo chat no quedo en la base.
  var quienes = v.personas != null ? v.personas : v.total;
  var conv = (r.clientes > 0 && v.disponible)
    ? Math.min(100, Math.round((quienes / r.clientes) * 100)) + '% de quienes consultaron'
    : 'por el asistente';

  var t = [
    { n: num(r.clientes),   k: 'Personas que consultaron', sub: 'contactos únicos' },
    { n: num(r.consultas),  k: 'Consultas recibidas',      sub: 'mensajes entrantes' },
    // El numero grande son las PROPIAS. El catalogo sale de Xintel, que es de
    // la red SOW y trae 124 unidades de varias inmobiliarias; mostrar 124 aca
    // seria decirle al cliente que tiene un inventario que no es suyo. Las de
    // la red van en el subtitulo, que es donde corresponde: el asistente
    // tambien las ofrece, pero aclarando de quien son.
    { n: inv.disponible ? num(inv.propias) : '—', k: 'Unidades propias',
      sub: inv.disponible
        ? (inv.red ? '+ ' + num(inv.red) + ' de la red del grupo · ' : '') +
          num(r.unidades_ofrecidas) + ' ' +
          plural(r.unidades_ofrecidas, 'ofrecida', 'ofrecidas') +
          (inv.reservadas ? ' · ' + inv.reservadas + ' reservada' + (inv.reservadas === 1 ? '' : 's') : '')
        : 'no se pudo leer el catálogo' },
    { n: num(r.fuera_horario), k: 'Fuera de horario',
      sub: (r.pct_fuera_horario || 0) + '% del total', destaca: true },
    { n: tiempo, k: 'Tiempo de respuesta', sub: 'mediana', destaca: true, crudo: true },
    { n: v.disponible ? num(v.total) : '—', k: 'Visitas agendadas',
      sub: v.disponible
        ? conv + (v.proximas ? ' · ' + v.proximas + ' por venir' : '')
        : 'no se pudo leer el calendario',
      destaca: true }
  ];

  $('tiles').innerHTML = t.map(function (x) {
    return '<div class="tile' + (x.destaca ? ' destaca' : '') + '">' +
      '<div class="n">' + (x.crudo ? x.n : esc(x.n)) + '</div>' +
      '<div class="k">' + esc(x.k) + '</div>' +
      '<div class="sub">' + esc(x.sub) + '</div>' +
    '</div>';
  }).join('');
}

/* ===========================================================================
   Barras horizontales. Cada barra lleva su etiqueta y su valor al lado, asi
   la identidad nunca depende del color solo y no hace falta leyenda aparte.
   =========================================================================== */
// `alClic` y `elegido` son opcionales: sin ellos las barras se dibujan igual
// que siempre. Con ellos cada fila se vuelve un boton y la elegida queda
// resaltada mientras el resto se apaga, exactamente como las celdas del
// heatmap. Se comparte el gesto a proposito: el que ya descubrio que puede
// hacer clic en una hora no tiene que volver a descubrirlo en las propiedades.
function barras(cont, filas, colorFn, sufijo, verMax, alClic, elegido) {
  cont.classList.remove('scrollea', 'elige', 'filtrando');
  cont.style.maxHeight = '';
  if (!filas.length) {
    cont.innerHTML = '<div class="vacio">Todavía no hay datos.</div>';
    return;
  }
  var max = Math.max.apply(null, filas.map(function (f) { return f.valor; })) || 1;
  cont.innerHTML = filas.map(function (f) {
    var pct = Math.max(2, (f.valor / max) * 100);
    var col = colorFn(f);
    var clave = f.clave || f.nombre;
    var sel = alClic && elegido && elegido === clave;
    return '<div class="fila' + (sel ? ' sel' : '') + '" data-tip="' + esc(f.tip || '') + '"' +
      (alClic ? ' data-k="' + esc(clave) + '" role="button" tabindex="0"' +
                ' aria-pressed="' + (sel ? 'true' : 'false') + '"' : '') + '>' +
      '<div class="cab">' +
        '<b><span class="punto" style="background:' + col + '"></span>' + esc(f.nombre) + '</b>' +
        '<em>' + num(f.valor) + ' ' + esc(sufijo(f.valor)) + '</em>' +
      '</div>' +
      '<div class="pista"><div class="marca-barra" style="width:' + pct + '%;background:' + col + '"></div></div>' +
    '</div>';
  }).join('');
  if (alClic) {
    cont.classList.add('elige');
    if (elegido) cont.classList.add('filtrando');
  }
  var pintadas = cont.querySelectorAll('.fila');
  pintadas.forEach(function (el) {
    el.addEventListener('mousemove', function (e) { tip(e, el.dataset.tip); });
    el.addEventListener('mouseleave', ocultarTip);
    if (!alClic) return;
    el.addEventListener('click', function () { alClic(el.dataset.k); });
    el.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();                        // la barra espaciadora scrollea
      alClic(el.dataset.k);
    });
  });

  // Se muestran las primeras `verMax` y el resto queda a un scroll. El alto se
  // mide sobre las filas ya pintadas -- la distancia entre la primera y la que
  // sobra -- en vez de estimarlo en px: asi el corte cae siempre entre dos
  // filas, aunque cambie el tamano de letra.
  if (verMax && pintadas.length > verMax) {
    cont.style.maxHeight = (pintadas[verMax].offsetTop - pintadas[0].offsetTop) + 'px';
    cont.classList.add('scrollea');
  }
}

function canales() {
  var filas = (DATOS.por_canal || []).map(function (c) {
    return {
      nombre: c.canal.charAt(0).toUpperCase() + c.canal.slice(1),
      valor: Number(c.consultas),
      canal: c.canal,
      tip: '<b>' + c.canal + '</b><br><span>' +
           c.clientes + ' ' + plural(c.clientes, 'persona', 'personas') + ' · ' +
           c.consultas + ' ' + plural(c.consultas, 'consulta', 'consultas') + ' · ' +
           c.respuestas + ' ' + plural(c.respuestas, 'respuesta', 'respuestas') + '</span>'
    };
  });
  barras($('canales'), filas, function (f) {
    return COLOR_CANAL[f.canal] || 'var(--text-muted)';
  }, function (v) { return plural(v, 'consulta', 'consultas'); });

  if (filas.length === 1) {
    $('canales').insertAdjacentHTML('beforeend',
      '<div class="sub" style="color:var(--text-muted);font-size:11.5px;margin-top:10px">' +
      'Hoy entra todo por Telegram. Este corte se vuelve útil cuando sumemos WhatsApp e Instagram.</div>');
  }
}

function propiedades() {
  // Que propiedades PUSO SOBRE LA MESA el agente, no por cuales preguntaron.
  // Sale de las REF que el agente menciona al mandar la ficha; la consulta de
  // la API cuenta personas distintas, no veces, para que una charla larga con
  // la misma propiedad no infle la barra.
  //
  // Una sola medida sobre varias entidades: un solo color. Pintar cada barra
  // de un color distinto sugeriria categorias que no existen.
  var filas = (DATOS.por_propiedad || []).map(function (p) {
    return {
      nombre: p.ref, clave: p.ref, valor: Number(p.clientes),
      tip: '<b>' + esc(p.ref) + '</b><br><span>ofrecida a ' + p.clientes + ' ' +
           plural(p.clientes, 'persona', 'personas') + '</span>' +
           '<br><span style="opacity:.6">Clic para ver esas conversaciones</span>'
    };
  });
  // Son ~45 refs: pintadas todas de una, el panel de al lado queda a media
  // pantalla de distancia. Se ven las 10 mas ofrecidas y el resto se scrollea.
  barras($('propiedades'), filas, function () { return 'var(--series-1)'; },
    function (v) { return plural(v, 'persona', 'personas'); }, 10, elegirRef, REF);
}

/* ===========================================================================
   Heatmap dia x hora. Magnitud continua => una sola tonalidad, oscuro a claro.
   =========================================================================== */
function heat() {
  var datos = DATOS.por_hora || [];
  var mapa = {};
  var max = 0;
  datos.forEach(function (d) {
    mapa[d.dia + '_' + d.hora] = d.n;
    if (d.n > max) max = d.n;
  });

  var html = '<div></div>';
  for (var h = 0; h < 24; h++) {
    html += '<div class="hh">' + (h % 3 === 0 ? h : '') + '</div>';
  }
  ORDEN_DIAS.forEach(function (d) {
    html += '<div class="dd">' + DIAS[d].slice(0, 3) + '</div>';
    for (var h = 0; h < 24; h++) {
      var n = mapa[d + '_' + h] || 0;
      var estilo = '';
      if (n > 0) {
        var i = max <= 1 ? RAMPA.length - 1
              : Math.min(RAMPA.length - 1, Math.floor((n / max) * (RAMPA.length - 1) + 0.5));
        estilo = 'background:' + RAMPA[i];
      }
      // Solo las celdas con consultas se pueden elegir: filtrar por una hora
      // vacia daria una lista vacia y ningun dato nuevo.
      var elegible = n > 0;
      var sel = elegible && CELDA && CELDA.dia === d && CELDA.hora === h;
      html += '<div class="celda' + (elegible ? ' v' : '') + (sel ? ' sel' : '') + '" ' +
              'style="' + estilo + '" ' +
              (elegible ? 'role="button" tabindex="0" data-dia="' + d + '" data-hora="' + h + '" ' +
                          'aria-pressed="' + (sel ? 'true' : 'false') + '" ' : '') +
              'data-tip="<b>' + DIAS[d] + ' ' + h + ':00</b><br><span>' +
              (n === 0 ? 'sin consultas' : n + ' consulta' + (n === 1 ? '' : 's')) + '</span>"></div>';
    }
  });
  $('heat').innerHTML = html;
  $('heat').className = 'heat' + (CELDA ? ' filtrando' : '');
  $('heat').querySelectorAll('.celda').forEach(function (el) {
    el.addEventListener('mousemove', function (e) { tip(e, el.dataset.tip); });
    el.addEventListener('mouseleave', ocultarTip);
    if (!el.dataset.dia) return;
    el.addEventListener('click', function () {
      elegirCelda(Number(el.dataset.dia), Number(el.dataset.hora));
    });
    el.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();                        // la barra espaciadora scrollea
      elegirCelda(Number(el.dataset.dia), Number(el.dataset.hora));
    });
  });

  $('escala').innerHTML = '<span>Menos</span>' +
    RAMPA.map(function (c) { return '<div class="paso" style="background:' + c + '"></div>'; }).join('') +
    '<span>Más</span>' +
    '<span style="margin-left:auto">Hora de Argentina</span>';
}

/* ===========================================================================
   Filtro por celda del heatmap
   =========================================================================== */
// Elegir la misma celda dos veces la apaga: es lo que espera cualquiera que
// haga clic sin leer nada.
function elegirCelda(dia, hora) {
  var mismo = CELDA && CELDA.dia === dia && CELDA.hora === hora;
  CELDA = mismo ? null : { dia: dia, hora: hora };
  ocultarTip();
  heat();
  lista();
}

function limpiarCelda() {
  if (!CELDA) return;
  CELDA = null;
  heat();
  lista();
}

// Qué conversaciones tuvieron una consulta en ese día y hora. Se resuelve
// contra dia/h de cada mensaje, que la API calcula con las MISMAS expresiones
// que el heatmap; y solo cuentan los del cliente, igual que las celdas.
function convsDeCelda() {
  if (!CELDA) return null;
  var ids = {};
  (DATOS.mensajes || []).forEach(function (m) {
    if (m.rol !== 'cliente' || m.dia !== CELDA.dia || m.h !== CELDA.hora) return;
    ids[m.canal + '|' + m.canal_id] = true;
  });
  return ids;
}

/* ===========================================================================
   Filtro por propiedad, por operación y por origen
   =========================================================================== */
// Mismo gesto que la celda del heatmap: volver a hacer clic en la misma barra
// la apaga.
function elegirRef(ref) {
  REF = (REF === ref) ? null : ref;
  ocultarTip();
  propiedades();
  lista();
}

// Las conversaciones en las que aparece esa propiedad.
//
// Se resuelve contra refs_habladas. Hoy ese campo coincide EXACTAMENTE con lo
// que cuentan las barras -- verificado contra la base: 0 de 39 conversaciones
// difieren -- pero la vista grun_conversaciones lo calcula sobre TODOS los
// mensajes, mientras que la barra cuenta solo los del agente. Si alguna vez un
// cliente pega una REF en su propio mensaje, esa charla va a salir en el filtro
// sin estar sumada en la barra. Si eso llega a pasar, la solución es que la API
// mande las refs del agente en un campo aparte.
function convsDeRef() {
  if (!REF) return null;
  var ids = {};
  (DATOS.conversaciones || []).forEach(function (c) {
    if ((c.refs_habladas || []).indexOf(REF) < 0) return;
    ids[c.canal + '|' + c.canal_id] = true;
  });
  return ids;
}

function elegirCanal(v)  { CANAL = (CANAL === v) ? null : v;      chips(); lista(); }
function elegirOper(v)   { OPER = (OPER === v) ? null : v;       chips(); lista(); }
function elegirOrigen(v) { ORIGEN = (ORIGEN === v) ? null : v;   chips(); lista(); }

// Los chips salen de los cortes que manda la API, no de una lista escrita acá:
// si mañana aparece una categoría nueva se dibuja sola, sin tocar el panel.
//
// Canal usa `por_canal_conv` y NO `por_canal`: el segundo cuenta mensajes y
// estos chips filtran conversaciones. Un chip que dice 99 sobre una lista de 60
// hace dudar de todo el panel.
function chips() {
  pintarChips($('chipsCanal'), 'Canal', DATOS.por_canal_conv || [], 'canal',
              CANAL_LABEL, CANAL, elegirCanal);
  pintarChips($('chipsOper'), 'Operación', DATOS.por_operacion || [], 'operacion',
              OPER_LABEL, OPER, elegirOper);
  pintarChips($('chipsOrigen'), 'Origen', DATOS.por_origen || [], 'origen',
              ORIGEN_LABEL, ORIGEN, elegirOrigen);
}

function pintarChips(cont, titulo, filas, campo, labels, activo, alClic) {
  if (!filas.length) { cont.innerHTML = ''; return; }
  cont.innerHTML = '<span class="grupo">' + titulo + '</span>' +
    filas.map(function (f) {
      var v = f[campo];
      return '<button type="button" class="chip' + (activo === v ? ' on' : '') + '" ' +
        'data-v="' + esc(v) + '" aria-pressed="' + (activo === v ? 'true' : 'false') + '">' +
        esc(labels[v] || v) + '<span class="n">' + f.n + '</span></button>';
    }).join('');
  cont.querySelectorAll('.chip').forEach(function (el) {
    el.addEventListener('click', function () { alClic(el.dataset.v); });
  });
}

// Apaga los cuatro filtros de un clic. No toca lo que haya escrito en el
// buscador: eso lo tipeó la persona y no es algo que se prendió sin querer.
function limpiarTodo() {
  if (!CELDA && !REF && !CANAL && !OPER && !ORIGEN) return;
  CELDA = null; REF = null; CANAL = null; OPER = null; ORIGEN = null;
  heat(); propiedades(); chips(); lista();
}

/* ===========================================================================
   Conversaciones y transcripción
   =========================================================================== */
function lista() {
  var q = ($('buscar').value || '').toLowerCase().trim();
  var deCelda = convsDeCelda();
  var deRef = convsDeRef();
  // Los cuatro filtros se combinan con Y. Es lo que espera cualquiera que
  // elija una hora y después toque "Alquiler": quiere las de esa hora QUE
  // ADEMÁS sean de alquiler, no la suma de las dos cosas.
  var convs = (DATOS.conversaciones || []).filter(function (c) {
    var id = c.canal + '|' + c.canal_id;
    if (deCelda && !deCelda[id]) return false;
    if (deRef && !deRef[id]) return false;
    if (CANAL && c.canal !== CANAL) return false;
    if (OPER && c.operacion !== OPER) return false;
    if (ORIGEN && c.origen !== ORIGEN) return false;
    if (!q) return true;
    return ((c.nombre || '') + ' ' + (c.ref_consultada || '') + ' ' + (c.primera_consulta || ''))
      .toLowerCase().indexOf(q) >= 0;
  });

  // Cartel con TODOS los filtros activos, cada uno con su propia ✕. Con cuatro
  // combinables, un único botón de "limpiar" obligaría a rearmar los otros tres
  // desde cero solo para soltar uno.
  var activos = [];
  if (CELDA) activos.push({
    etq: DIAS[CELDA.dia] + ' ' + (CELDA.hora < 10 ? '0' : '') + CELDA.hora + ':00',
    quitar: limpiarCelda
  });
  if (REF)    activos.push({ etq: REF, quitar: function () { elegirRef(REF); } });
  if (CANAL)  activos.push({ etq: CANAL_LABEL[CANAL] || CANAL, quitar: function () { elegirCanal(CANAL); } });
  if (OPER)   activos.push({ etq: OPER_LABEL[OPER] || OPER, quitar: function () { elegirOper(OPER); } });
  if (ORIGEN) activos.push({ etq: ORIGEN_LABEL[ORIGEN] || ORIGEN, quitar: function () { elegirOrigen(ORIGEN); } });

  var cartel = $('filtro-celda');
  cartel.hidden = !activos.length;
  if (activos.length) {
    cartel.innerHTML = activos.map(function (a, i) {
      return '<span class="etq">' + esc(a.etq) + '</span>' +
        '<button class="quitar" type="button" data-i="' + i + '" title="Quitar filtro" ' +
          'aria-label="Quitar filtro ' + esc(a.etq) + '">✕</button>';
    }).join('') +
    '<span class="cant">' + convs.length + ' ' +
      plural(convs.length, 'conversación', 'conversaciones') + '</span>';
    cartel.querySelectorAll('.quitar').forEach(function (b) {
      b.addEventListener('click', function () { activos[+b.dataset.i].quitar(); });
    });
  }

  if (!convs.length) {
    $('lista').innerHTML = '<div class="vacio">' +
      (activos.length ? 'Ninguna conversación con esos filtros.' : 'Sin conversaciones.') + '</div>';
    return;
  }

  $('lista').innerHTML = convs.map(function (c) {
    var col = COLOR_CANAL[c.canal] || 'var(--text-muted)';
    return '<button class="item" data-id="' + esc(c.canal + '|' + c.canal_id) + '" ' +
      'aria-current="' + (ACTIVA === c.canal + '|' + c.canal_id) + '">' +
      '<div class="nom"><span class="punto" style="background:' + col + '"></span>' +
        esc(c.nombre || 'Sin nombre') + '</div>' +
      '<div class="meta">' + esc(c.ultimo_contacto) + ' · ' + c.mensajes_cliente + ' ' +
        plural(c.mensajes_cliente, 'consulta', 'consultas') +
        (c.ref_consultada ? ' · ' + esc(c.ref_consultada) : '') + '</div>' +
      '<div class="prev">' + esc(c.primera_consulta || '') + '</div>' +
      // Las dos etiquetas van en cada fila y no solo en los chips de arriba:
      // con un filtro puesto igual se ve por qué entró cada conversación, y
      // sin ningún filtro se leen las dos categorías de un vistazo.
      '<div class="tags">' +
        (c.origen ? '<span class="tag' + (c.origen === 'pauta' ? ' pauta' : '') + '">' +
                    esc(ORIGEN_LABEL[c.origen] || c.origen) + '</span>' : '') +
        (c.operacion ? '<span class="tag">' + esc(OPER_LABEL[c.operacion] || c.operacion) +
                       '</span>' : '') +
      '</div>' +
    '</button>';
  }).join('');

  $('lista').querySelectorAll('.item').forEach(function (el) {
    el.addEventListener('click', function () { abrir(el.dataset.id); });
  });
}
$('buscar').addEventListener('input', lista);

// "Clic en otro lado y se borra la selección". Dos excepciones a proposito:
// la celda -que ya se maneja sola- y el panel de Conversaciones, porque ahi
// se esta USANDO el filtro (abrir una charla de las que quedaron), no
// abandonandolo. El cartel tiene su propia ✕ para salir.
// En CAPTURA, no en burbujeo: abrir una conversacion vuelve a dibujar la lista,
// asi que para cuando el clic sube hasta aca el boton ya no existe y su
// closest('#conversaciones') sube por un arbol huerfano y no encuentra nada.
// En captura corremos antes de que nadie redibuje y el elemento sigue en su
// lugar.
// Se sueltan solo los dos filtros que se eligen con un gesto sobre un gráfico
// -la celda y la barra-. Los chips NO: son un estado que la persona prendió a
// propósito, y que se apagaran al hacer clic en cualquier parte sería un
// misterio, no una comodidad.
//
// La barra tiene que estar excluida igual que la celda, y no solo por prolijo:
// este handler corre en CAPTURA, o sea ANTES del click de la barra. Sin la
// excepción, volver a hacer clic en la barra ya elegida la apagaría acá y
// elegirRef la volvería a prender un instante después: no se podría soltar.
document.addEventListener('click', function (e) {
  if (!CELDA && !REF) return;
  if (e.target.closest('.celda.v') || e.target.closest('.barras.elige .fila') ||
      e.target.closest('#conversaciones')) return;
  CELDA = null;
  REF = null;
  heat();
  propiedades();
  lista();
}, true);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') limpiarTodo();
});

// Por donde se le escribe a esta persona desde el panel.
//
// En WhatsApp el canal_id ES el telefono. En Instagram no hay telefono -y el
// equipo contesta por el mismo DM-, pero el @usuario arma un link directo a esa
// conversacion. Telegram se queda sin link: su id es interno y no existe una URL
// publica que se pueda armar con el.
//
// Devuelve null cuando no hay forma de escribirle: quien llama decide que
// mostrar en su lugar.
function contactoDe(c) {
  if (c.canal === 'whatsapp') {
    var d = String(c.canal_id || '').replace(/\D/g, '');
    if (!d) return null;
    return { href: 'https://wa.me/' + d, etiqueta: 'Escribir', icono: ICONO_TEL,
             texto: formatTelefono(d), clase: 'btn-wa' };
  }
  if (c.canal === 'instagram') {
    var u = String(c.username || '').replace(/^@/, '');
    if (!u) return null;   // el perfil no se pudo resolver: solo queda el IGSID
    return { href: 'https://ig.me/m/' + u, etiqueta: 'Abrir DM', icono: ICONO_IG,
             texto: '@' + u, clase: 'btn-wa ig' };
  }
  return null;
}

// Con quien estas hablando y como escribirle, sin pasar por la pestaña Clientes.
function cabecera(canal, canalId) {
  var cab = $('hilo-cab');
  var c = (DATOS.conversaciones || []).filter(function (x) {
    return x.canal === canal && String(x.canal_id) === canalId;
  })[0];
  if (!c) { cab.hidden = true; return; }

  var ct = contactoDe(c);
  var contacto = ct
    ? '<div class="tel">' + ct.icono + esc(ct.texto) + '</div>'
    : '<div class="tel">' + esc(CANAL_LABEL[c.canal] || c.canal) +
      (c.username ? ' · ' + esc(c.username) : '') + '</div>';

  cab.innerHTML =
    '<div class="quien">' +
      '<div class="nom">' + esc(c.nombre || 'Sin nombre') + '</div>' +
      contacto +
    '</div>' +
    (ct
      ? '<a class="' + ct.clase + '" href="' + esc(ct.href) + '" target="_blank" rel="noopener">' +
        ct.icono + ' ' + ct.etiqueta + '</a>'
      : '');
  cab.hidden = false;
}

function abrir(id) {
  ACTIVA = id;
  lista();
  var partes = id.split('|');
  var msgs = (DATOS.mensajes || []).filter(function (m) {
    return m.canal === partes[0] && String(m.canal_id) === partes[1];
  });

  cabecera(partes[0], partes[1]);

  if (!msgs.length) {
    $('hilo').innerHTML = '<div class="vacio">No hay mensajes guardados de esta conversación.</div>';
    return;
  }
  $('hilo').innerHTML = msgs.map(function (m) {
    return '<div class="msg ' + (m.rol === 'agente' ? 'agente' : 'cliente') + '">' +
      '<div class="burbuja">' + formatear(m.mensaje) + '</div>' +
      '<div class="sello-msg">' + esc(m.hora) +
        (m.en_horario ? '' : '<span class="fuera">fuera de horario</span>') +
      '</div>' +
    '</div>';
  }).join('');
  $('hilo').scrollTop = 0;
}

/* ===========================================================================
   Clientes — ficha de contacto directo. Mismos datos que Conversaciones
   (salen del mismo `conversaciones` de la API), presentados para UNA cosa:
   encontrar a alguien y escribirle por WhatsApp, no para leer el historial.
   =========================================================================== */
function clientes() {
  var q = ($('buscarClientes').value || '').toLowerCase().trim();

  var todos = (DATOS.conversaciones || []).map(function (c) {
    var esWhatsapp = c.canal === 'whatsapp';
    var nombre = c.nombre || 'Sin nombre';
    var ct = contactoDe(c);
    return {
      nombre: nombre,
      iniciales: iniciales(nombre) || '?',
      canalColor: COLOR_CANAL[c.canal] || 'var(--text-muted)',
      canalLabel: CANAL_LABEL[c.canal] || c.canal || '',
      // Solo WhatsApp trae un numero real (canal_id). En Instagram el contacto
      // es el @usuario, y con eso alcanza para abrirle el DM.
      contacto: ct ? ct.texto : (c.username || 'Sin usuario'),
      // Solo los digitos, sin formato: es contra esto que se busca por
      // telefono. El numero formateado ("+54 9 3794 35-7488") tiene espacios
      // y un guion que le cortan a la mitad cualquier tira de digitos que
      // alguien tipee de corrido.
      telDigits: esWhatsapp ? String(c.canal_id || '').replace(/\D/g, '') : '',
      href: ct ? ct.href : '',
      accionEtiqueta: ct ? ct.etiqueta : '',
      accionIcono: ct ? ct.icono : '',
      accionClase: ct ? ct.clase : '',
      ultimo: c.ultimo_contacto || '',
      ref: c.ref_consultada || ''
    };
  });

  var qDigits = q.replace(/\D/g, '');
  var visibles = !q ? todos : todos.filter(function (c) {
    return c.nombre.toLowerCase().indexOf(q) >= 0 ||
      (c.contacto || '').toLowerCase().indexOf(q) >= 0 ||
      (qDigits && c.telDigits.indexOf(qDigits) >= 0);
  });

  $('cantClientes').textContent = q
    ? visibles.length + ' de ' + todos.length + ' ' + plural(todos.length, 'cliente', 'clientes')
    : todos.length + ' ' + plural(todos.length, 'cliente', 'clientes');

  if (!visibles.length) {
    $('clientesGrid').innerHTML = '<div class="vacio">' +
      (q ? 'Ningún cliente coincide con la búsqueda.' : 'Todavía no hay clientes.') + '</div>';
    return;
  }

  $('clientesGrid').innerHTML = visibles.map(function (c) {
    var accion = c.href
      ? '<a class="' + c.accionClase + '" href="' + esc(c.href) + '" target="_blank" rel="noopener">' +
        c.accionIcono + ' ' + esc(c.accionEtiqueta) + '</a>'
      : '<span class="sin-contacto">Solo por ' + esc(c.canalLabel) + '</span>';
    var chip = c.ref
      ? '<span class="chip-prop">' + esc(c.ref) + '</span>'
      : '<span class="chip-prop vacia">Sin propiedad puntual</span>';
    return (
      '<div class="card-cliente">' +
        '<div class="avatar">' + esc(c.iniciales) +
          '<span class="punto-canal" style="background:' + c.canalColor + '"></span></div>' +
        '<div class="card-cliente-body">' +
          '<div class="card-cliente-top"><div class="nombre">' + esc(c.nombre) + '</div>' + accion + '</div>' +
          '<div class="contacto">' + esc(c.contacto) + '</div>' +
          '<div class="card-cliente-meta">' +
            '<span class="canal-label" style="color:' + c.canalColor + '">' + esc(c.canalLabel) + '</span>' +
            '<span>·</span><span>' + esc(c.ultimo) + '</span>' +
          '</div>' +
          chip +
        '</div>' +
      '</div>'
    );
  }).join('');
}
$('buscarClientes').addEventListener('input', clientes);

function mostrarTab(cual) {
  var esResumen = cual === 'resumen';
  $('vistaResumen').hidden = !esResumen;
  $('vistaClientes').hidden = esResumen;
  $('tabResumenBtn').classList.toggle('activo', esResumen);
  $('tabClientesBtn').classList.toggle('activo', !esResumen);
}
$('tabResumenBtn').addEventListener('click', function () { mostrarTab('resumen'); });
$('tabClientesBtn').addEventListener('click', function () { mostrarTab('clientes'); });

/* ===========================================================================
   Tooltip
   =========================================================================== */
function tip(e, html) {
  if (!html) return;
  var t = $('tip');
  t.innerHTML = html;
  t.style.opacity = 1;
  var x = e.clientX + 14, y = e.clientY + 14;
  var r = t.getBoundingClientRect();
  if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - 14;
  t.style.left = x + 'px';
  t.style.top = y + 'px';
}
function ocultarTip() { $('tip').style.opacity = 0; }
</script>
